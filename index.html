<style>
/* Layout: satu kolom sempit seperti kartu belajar di tangan. Menu tiga kategori, lalu dek kartu yang bisa dibalik. */
:root{
  --bg:#EEF1F6;
  --surface:#FFFFFF;
  --ink:#141C2B;
  --muted:#5A6678;
  --line:#D6DCE6;
  --indigo:#2B4A94;
  --on-indigo:#FFFFFF;
  --tint:#E1E8F7;
  --good:#2F6B49;
  --on-good:#FFFFFF;
  --bad:#B03E2A;
  --font-jp:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --font-ui:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131D;--surface:#171E2C;--ink:#E9EDF5;--muted:#9AA5B9;--line:#29334A;
    --indigo:#8EA7EE;--on-indigo:#0E131D;--tint:#1E2A47;--good:#72C08F;--on-good:#0E131D;--bad:#EB8B76;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131D;--surface:#171E2C;--ink:#E9EDF5;--muted:#9AA5B9;--line:#29334A;
  --indigo:#8EA7EE;--on-indigo:#0E131D;--tint:#1E2A47;--good:#72C08F;--on-good:#0E131D;--bad:#EB8B76;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font-ui);font-size:15px;line-height:1.55;
  padding-block:20px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-width:0}

/* ---------- menu ---------- */
.eyebrow{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{margin:4px 0 6px;font-family:var(--font-jp);font-weight:700;font-size:clamp(30px,9vw,40px);line-height:1.15;text-wrap:balance}
.lede{margin:0 0 22px;color:var(--muted);max-width:42ch}
.modes{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.mode{
  width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;
}
.mode:active{transform:translateY(1px)}
.glyph{
  grid-row:1 / span 2;width:60px;height:60px;display:grid;place-items:center;
  background:var(--tint);color:var(--indigo);border-radius:10px;
  font-family:var(--font-jp);font-weight:700;font-size:34px;
}
.mode b{font-size:18px;font-weight:700;align-self:end}
.mode small{color:var(--muted);align-self:start}
.mode .meta{grid-row:1 / span 2;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted);font-size:13px;line-height:1.3}
.mode .meta strong{display:block;font-size:20px;color:var(--ink);font-weight:700}
.mbar{grid-column:1 / -1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.mbar i{display:block;height:100%;background:var(--good)}
.foot{margin:22px 0 0;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.confirm{display:inline-flex;gap:10px;align-items:center}
.confirm button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
.confirm .danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}

/* ---------- permainan ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.navback{background:none;border:0;padding:8px 10px 8px 0;font-weight:700;color:var(--indigo)}
.bar .title{font-family:var(--font-jp);font-weight:700;font-size:18px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);min-width:64px;text-align:right}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:2px 0 12px}
.prog i{display:block;height:100%;background:var(--indigo);transition:width .25s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{
  border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted);
}
.chip[aria-pressed="true"]{background:var(--tint);border-color:var(--indigo);color:var(--ink);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg .chip{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg .chip:last-child{border-right:0}

.card{display:block;width:100%;height:clamp(320px,50vh,420px);padding:0;border:0;background:none;perspective:1200px;text-align:center}
.inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.card.noanim .inner{transition:none}
.face{
  position:absolute;inset:0;border-radius:14px;border:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 20px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.front::after{content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:8px;pointer-events:none}
.back{transform:rotateY(180deg)}
.face.back{background:var(--tint);border-color:var(--indigo)}
.kanji{font-family:var(--font-jp);font-weight:700;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere}
.kanji.l1,.kanji.l2{font-size:clamp(72px,26vw,116px)}
.kanji.l3{font-size:clamp(60px,20vw,92px)}
.kanji.l4{font-size:clamp(46px,15vw,70px)}
.kanji.l5,.kanji.l6{font-size:clamp(38px,12vw,56px)}
.tag{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--indigo);border:1px solid var(--indigo);border-radius:6px;padding:2px 8px}
.hint{position:absolute;bottom:22px;left:0;right:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.extra{position:absolute;top:20px;right:20px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);z-index:1}
.ref{font-family:var(--font-jp);font-size:20px;color:var(--muted)}
.hira{font-size:clamp(34px,11vw,46px);font-weight:500;line-height:1.25}
.rule{width:48px;height:2px;background:var(--indigo);border:0;margin:2px 0}
.arti{font-size:clamp(20px,6vw,24px);font-weight:500;line-height:1.35;max-width:22ch;text-wrap:balance}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;transition:opacity .2s}
.actions.wait{opacity:.35;pointer-events:none}
.act{border-radius:10px;padding:14px 10px;font-weight:700;font-size:16px;border:2px solid transparent}
.act.no{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.act.yes{background:var(--good);color:var(--on-good)}
.stats{margin:14px 0 0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.panel h2{margin:0;font-family:var(--font-jp);font-size:26px}
.panel p{margin:0;color:var(--muted);max-width:34ch}
.big{font-family:var(--font-jp);font-size:54px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.btn{width:100%;max-width:300px;border-radius:10px;padding:13px 14px;font-weight:700;border:2px solid var(--indigo);background:var(--indigo);color:var(--on-indigo)}
.btn.alt{background:var(--surface);color:var(--indigo)}

@media (prefers-reduced-motion: reduce){
  .inner,.prog i,.actions{transition:none}
}
</style>

function parse(list, extra, kind, tag){
  return list.map(function(s){
    var p = s.split("|");
    var t = tag || "";
    if(kind === "verb" && /する$/.test(p[1])) t = "する";
    return { k:p[0], h:p[1], m:p[2], t:t, x:extra, id:kind+"|"+p[0]+"|"+p[1] };
  });
}
var DATA = {
  verb: parse(VERB,false,"verb").concat(parse(VERBX,true,"verb")),
  noun: parse(NOUN,false,"noun").concat(parse(NOUNX,true,"noun")),
  adj:  parse(ADJI,false,"adj","い").concat(parse(ADJIX,true,"adj","い"),parse(ADJNA,false,"adj","な"),parse(ADJNAX,true,"adj","な"))
};
var MODES = {
  verb:{ title:"Kata Kerja", sub:"動詞 · doushi", glyph:"動" },
  noun:{ title:"Kata Benda", sub:"名詞 · meishi", glyph:"名" },
  adj: { title:"Kata Sifat", sub:"形容詞 · keiyoushi", glyph:"形" }
};
var TAGNAME = { "い":"い形容詞", "な":"な形容詞", "する":"する動詞" };

/* ================= STATE ================= */
var KEY = "kanjin3-hafal-v1";
var known = {};
try{ known = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; }catch(e){ known = {}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(known)); }catch(e){} }

var S = {
  screen:"home", mode:null, confirmReset:false,
  o:{ shuffle:true, extra:true, unknown:false, adj:"all" },
  deck:[], i:0, flipped:false, hafal:0, belum:0, streak:0, missed:[], review:false
};
var app = document.getElementById("app");

function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function countKnown(mode){
  return DATA[mode].reduce(function(n,c){ return n + (known[c.id] ? 1 : 0); }, 0);
}

/* ================= DECK ================= */
function buildDeck(){
  var o = S.o;
  var a = DATA[S.mode].filter(function(c){
    if(!o.extra && c.x) return false;
    if(S.mode === "adj" && o.adj !== "all" && c.t !== o.adj) return false;
    if(o.unknown && known[c.id]) return false;
    return true;
  });
  if(o.shuffle) shuffle(a);
  resetRun(a, false);
}
function resetRun(a, review){
  S.deck = a; S.i = 0; S.flipped = false; S.hafal = 0; S.belum = 0; S.streak = 0; S.missed = []; S.review = review;
}

/* ================= RENDER ================= */
function renderHome(){
  S.screen = "home";
  var rows = Object.keys(MODES).map(function(m){
    var total = DATA[m].length, k = countKnown(m), pct = total ? Math.round(k/total*100) : 0;
    return '<li><button class="mode" data-act="mode" data-mode="'+m+'">'+
      '<span class="glyph" aria-hidden="true">'+MODES[m].glyph+'</span>'+
      '<b>'+MODES[m].title+'</b><small>'+MODES[m].sub+'</small>'+
      '<span class="meta"><strong>'+k+'/'+total+'</strong>hafal</span>'+
      '<span class="mbar"><i style="width:'+pct+'%"></i></span>'+
    '</button></li>';
  }).join("");
  var reset = S.confirmReset
    ? '<span class="confirm">Hapus semua tanda hafal? <button data-act="reset-yes" class="danger">Hapus</button><button data-act="reset-no">Batal</button></span>'
    : '<button class="link" data-act="reset">Reset progres</button>';
  app.innerHTML =
    '<p class="eyebrow">JLPT N3</p><h1>Kanji N3 Flashcard</h1>'+
    '<p class="lede">Pilih jenis kata. Ketuk kartu untuk melihat bacaan hiragana dan artinya, lalu tandai hafal atau belum.</p>'+
    '<ul class="modes">'+rows+'</ul>'+
    '<p class="foot"><span>Kata tambahan N3 diberi label &ldquo;Tambahan&rdquo; di kartu.</span>'+reset+'</p>';
}

function chip(act, label, on){
  return '<button class="chip" data-act="'+act+'" aria-pressed="'+(on?'true':'false')+'">'+label+'</button>';
}
function renderGame(){
  S.screen = "game";
  var M = MODES[S.mode], o = S.o;
  var chips = chip("o-shuffle","Acak",o.shuffle) + chip("o-extra","Tambahan N3",o.extra) + chip("o-unknown","Belum hafal saja",o.unknown);
  if(S.mode === "adj"){
    chips += '<span class="seg" role="group" aria-label="Jenis kata sifat">'+
      chip("adj-all","Semua",o.adj==="all")+chip("adj-い","い",o.adj==="い")+chip("adj-な","な",o.adj==="な")+'</span>';
  }
  var head =
    '<div class="bar"><button class="navback" data-act="home" aria-label="Kembali ke menu">&lsaquo; Menu</button>'+
    '<span class="title">'+M.title+(S.review?' · ulang':'')+'</span><span class="count" id="count"></span></div>'+
    '<div class="prog"><i id="prog"></i></div>';
  var chipsHtml = '<div class="chips">'+chips+'</div>';

  if(!S.deck.length){
    app.innerHTML = head + chipsHtml +
      '<div class="panel"><h2>Kartu kosong</h2><p>Tidak ada kartu dengan pilihan ini. Matikan &ldquo;Belum hafal saja&rdquo; atau ubah filter.</p></div>';
    updateTop();
    return;
  }
  if(S.i >= S.deck.length){
    var total = S.hafal + S.belum;
    app.innerHTML = head + chipsHtml +
      '<div class="panel"><p class="eyebrow">Selesai</p><div class="big">'+S.hafal+' / '+total+'</div>'+
      '<p>'+(S.belum ? S.belum+' kartu masih perlu diulang.' : 'Semua kartu di putaran ini sudah hafal.')+'</p>'+
      (S.belum ? '<button class="btn" data-act="review">Ulangi yang belum hafal</button>' : '')+
      '<button class="btn'+(S.belum?' alt':'')+'" data-act="restart">Mulai lagi</button>'+
      '<button class="btn alt" data-act="home">Kembali ke menu</button></div>';
    updateTop();
    return;
  }
  app.innerHTML = head + chipsHtml +
    '<button class="card" id="card" data-act="flip" aria-label="Kartu. Ketuk untuk membalik.">'+
      '<div class="inner">'+
        '<div class="face front" id="front"></div>'+
        '<div class="face back" id="back"></div>'+
      '</div></button>'+
    '<div class="actions wait" id="actions">'+
      '<button class="act no" data-act="no">Belum hafal</button>'+
      '<button class="act yes" data-act="yes">Hafal</button></div>'+
    '<p class="stats" id="stats"></p>';
  fillCard();
  updateTop();
}

function fillCard(){
  var c = S.deck[S.i];
  var len = Math.min(c.k.length, 6);
  var card = document.getElementById("card");
  card.classList.add("noanim");
  card.classList.remove("flipped");
  S.flipped = false;
  document.getElementById("front").innerHTML =
    (c.x ? '<span class="extra">Tambahan</span>' : '') +
    '<div class="kanji l'+len+'" lang="ja">'+c.k+'</div>'+
    (c.t ? '<span class="tag">'+TAGNAME[c.t]+'</span>' : '')+
    '<span class="hint">Ketuk untuk membalik</span>';
  document.getElementById("back").innerHTML =
    (c.x ? '<span class="extra">Tambahan</span>' : '') +
    '<div class="ref" lang="ja">'+c.k+'</div>'+
    '<div class="hira" lang="ja">'+c.h+'</div><hr class="rule">'+
    '<div class="arti">'+c.m+'</div>';
  void card.offsetWidth;
  card.classList.remove("noanim");
  document.getElementById("actions").classList.add("wait");
}

function updateTop(){
  var n = S.deck.length;
  var cnt = document.getElementById("count");
  var prog = document.getElementById("prog");
  if(cnt) cnt.textContent = n ? Math.min(S.i+1, n)+" / "+n : "0 / 0";
  if(prog) prog.style.width = (n ? Math.min(S.i, n)/n*100 : 0)+"%";
  var st = document.getElementById("stats");
  if(st) st.innerHTML = '<span>Hafal <b>'+S.hafal+'</b></span><span>Belum <b>'+S.belum+'</b></span><span>Beruntun <b>'+S.streak+'</b></span>';
}

/* ================= ACTIONS ================= */
function flip(){
  var card = document.getElementById("card");
  if(!card) return;
  S.flipped = !S.flipped;
  card.classList.toggle("flipped", S.flipped);
  if(S.flipped) document.getElementById("actions").classList.remove("wait");
}
function mark(yes){
  if(S.screen !== "game" || S.i >= S.deck.length) return;
  var c = S.deck[S.i];
  if(yes){ known[c.id] = 1; S.hafal++; S.streak++; }
  else { delete known[c.id]; S.belum++; S.streak = 0; S.missed.push(c); }
  save();
  S.i++;
  if(S.i >= S.deck.length){ renderGame(); }
  else { fillCard(); updateTop(); }
}

app.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(!el) return;
  var a = el.getAttribute("data-act");
  if(a === "mode"){ S.mode = el.getAttribute("data-mode"); S.o.adj = "all"; S.o.unknown = false; buildDeck(); renderGame(); }
  else if(a === "home"){ S.confirmReset = false; renderHome(); }
  else if(a === "flip"){ flip(); }
  else if(a === "yes"){ mark(true); }
  else if(a === "no"){ mark(false); }
  else if(a === "o-shuffle"){ S.o.shuffle = !S.o.shuffle; buildDeck(); renderGame(); }
  else if(a === "o-extra"){ S.o.extra = !S.o.extra; buildDeck(); renderGame(); }
  else if(a === "o-unknown"){ S.o.unknown = !S.o.unknown; buildDeck(); renderGame(); }
  else if(a.indexOf("adj-") === 0){ S.o.adj = a.slice(4); buildDeck(); renderGame(); }
  else if(a === "restart"){ buildDeck(); renderGame(); }
  else if(a === "review"){ var m = S.missed.slice(); if(S.o.shuffle) shuffle(m); resetRun(m, true); renderGame(); }
  else if(a === "reset"){ S.confirmReset = true; renderHome(); }
  else if(a === "reset-no"){ S.confirmReset = false; renderHome(); }
  else if(a === "reset-yes"){ known = {}; save(); S.confirmReset = false; renderHome(); }
});

document.addEventListener("keydown", function(e){
  if(S.screen !== "game" || !document.getElementById("card")) return;
  if(e.key === "ArrowUp" || e.key === "ArrowDown"){ e.preventDefault(); flip(); }
  else if(e.key === "ArrowRight" && S.flipped){ mark(true); }
  else if(e.key === "ArrowLeft" && S.flipped){ mark(false); }
});

renderHome();
})();
</script>
